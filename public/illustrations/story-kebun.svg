<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#EAE4D3"/>
  <!-- Mountain contours of Pasawahan -->
  <path d="M0 260 C150 200 280 230 400 180 C500 140 560 170 600 190 L600 400 L0 400 Z" fill="#23483D" opacity="0.85"/>
  <path d="M0 310 C180 270 320 300 460 260 C530 240 570 250 600 270 L600 400 L0 400 Z" fill="#18352D"/>
  
  <!-- Clove tree canopy silhouette -->
  <circle cx="180" cy="180" r="70" fill="#356354"/>
  <circle cx="140" cy="210" r="50" fill="#23483D"/>
  <circle cx="220" cy="210" r="55" fill="#23483D"/>
  <rect x="175" y="240" width="10" height="80" rx="3" fill="#873E29"/>
  <!-- Bamboo ladder -->
  <line x1="200" y1="180" x2="215" y2="320" stroke="#B08A47" stroke-width="3" stroke-linecap="round"/>
  <line x1="212" y1="180" x2="227" y2="320" stroke="#B08A47" stroke-width="3" stroke-linecap="round"/>
  <line x1="203" y1="205" x2="215" y2="205" stroke="#B08A47" stroke-width="2.5"/>
  <line x1="206" y1="235" x2="218" y2="235" stroke="#B08A47" stroke-width="2.5"/>
  <line x1="209" y1="265" x2="221" y2="265" stroke="#B08A47" stroke-width="2.5"/>
  <line x1="212" y1="295" x2="224" y2="295" stroke="#B08A47" stroke-width="2.5"/>
  
  <!-- Clove buds accent -->
  <circle cx="450" cy="110" r="14" fill="#A44F36"/>
  <rect x="447" y="122" width="6" height="24" rx="2" fill="#B08A47"/>
  <circle cx="480" cy="130" r="12" fill="#A44F36"/>
  <rect x="477" y="140" width="6" height="20" rx="2" fill="#B08A47"/>
  <!-- Morning mist overlay -->
  <path d="M0 130 Q150 110 300 130 T600 120" stroke="#FFFCF6" stroke-width="18" opacity="0.35" stroke-linecap="round"/>
  <path d="M50 170 Q200 150 350 170 T600 160" stroke="#FFFCF6" stroke-width="12" opacity="0.25" stroke-linecap="round"/>
</svg>

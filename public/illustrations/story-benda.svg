<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#F4EFE6"/>
  <!-- Warm background glow -->
  <circle cx="300" cy="200" r="160" fill="#F6F1E6"/>

  <!-- Boboko / Woven Bamboo Basket Silhouette -->
  <!-- Base square stand -->
  <rect x="250" y="290" width="100" height="24" rx="4" fill="#8D6E34"/>
  <!-- Basket conical woven body -->
  <path d="M260 290 L180 140 L420 140 L340 290 Z" fill="#D4A95B"/>
  <!-- Basket rim -->
  <ellipse cx="300" cy="140" rx="120" ry="24" fill="#B08A47"/>
  <ellipse cx="300" cy="140" rx="110" ry="18" fill="#F6F1E6"/>

  <!-- Subtle bamboo woven grid pattern lines -->
  <line x1="220" y1="160" x2="310" y2="280" stroke="#8D6E34" stroke-width="1.8" opacity="0.6"/>
  <line x1="260" y1="150" x2="330" y2="280" stroke="#8D6E34" stroke-width="1.8" opacity="0.6"/>
  <line x1="380" y1="160" x2="290" y2="280" stroke="#8D6E34" stroke-width="1.8" opacity="0.6"/>
  <line x1="340" y1="150" x2="270" y2="280" stroke="#8D6E34" stroke-width="1.8" opacity="0.6"/>

  <!-- Family legacy warmth accent -->
  <circle cx="160" cy="90" r="8" fill="#A44F36" opacity="0.8"/>
  <circle cx="440" cy="100" r="6" fill="#A44F36" opacity="0.8"/>
</svg>

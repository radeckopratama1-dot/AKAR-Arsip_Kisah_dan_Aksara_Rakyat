<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#F7F1E6"/>
  <!-- Canopy of traditional market stall -->
  <path d="M40 80 L560 50 L580 150 L20 180 Z" fill="#A44F36" opacity="0.9"/>
  <path d="M40 80 L560 50 L560 70 L40 100 Z" fill="#873E29"/>

  <!-- Stall counter -->
  <rect x="60" y="240" width="480" height="130" rx="8" fill="#D4A95B"/>
  <rect x="50" y="225" width="500" height="25" rx="4" fill="#B08A47"/>

  <!-- Banana leaf serving platter with timbel rice -->
  <ellipse cx="300" cy="210" rx="140" ry="40" fill="#23483D"/>
  <ellipse cx="300" cy="210" rx="130" ry="34" fill="#356354"/>

  <!-- Rice wrapped rolls -->
  <ellipse cx="250" cy="205" rx="35" ry="18" fill="#FFFCF6"/>
  <ellipse cx="330" cy="200" rx="40" ry="20" fill="#FFFCF6"/>
  <circle cx="390" cy="205" r="14" fill="#A44F36"/>
